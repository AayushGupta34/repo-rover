[project]
name = "repo-rover"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aayush Gupta", email = "iamaayushgupta2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "crewai>=1.15.41",
    "crewai-tools>=1.15.41",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
repo-rover = "repo_rover:main"
reporover = "repo_rover.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
